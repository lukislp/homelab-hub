# Gateway API route through your shared Gateway. BackendTLSPolicy below enforces
# TLS verification on the Gateway -> Pod hop (server.mjs terminates TLS natively,
# see deployment.yaml).
#
# Replace the placeholders before applying:
#   - spec.parentRefs: name/namespace of your Gateway object (`kubectl get gateway -A`)
#   - spec.hostnames: the hostname(s) you want to expose this on
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homelab-hub
  namespace: homelab-hub
spec:
  parentRefs:
    - name: my-gateway
      namespace: nginx-gateway
  hostnames:
    - hub.example.com
  rules:
    - backendRefs:
        - name: homelab-hub
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: homelab-hub-backend-tls
  namespace: homelab-hub
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: homelab-hub
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: homelab-hub-backend-tls
    hostname: homelab-hub.homelab-hub.svc.cluster.local
---
apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: homelab-hub-rate-limit
  namespace: homelab-hub
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homelab-hub
  rateLimit:
    local:
      rules:
        - zoneSize: 10m
          key: "$binary_remote_addr"
          rate: 20r/s
          burst: 200
          noDelay: true
    rejectCode: 503
