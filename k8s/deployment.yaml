apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-hub-backend-tls
  namespace: homelab-hub
spec:
  secretName: homelab-hub-backend-tls
  dnsNames:
    - homelab-hub.homelab-hub.svc.cluster.local
    - homelab-hub
  issuerRef:
    name: studylife-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-hub
  namespace: homelab-hub
  labels:
    app.kubernetes.io/name: homelab-hub
spec:
  replicas: 1
  # Recreate instead of RollingUpdate: there's a single writer for links.json,
  # and the RWO volume (local-path) is bound to one node anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-hub
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup (cluster/10-velero-values.yaml
        # there): /data holds the user-created link collection - the one thing a redeploy
        # cannot reproduce.
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup makes the local-path volume writable for uid 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          # Pin to a specific tag, never ":latest" — with imagePullPolicy: IfNotPresent,
          # a ":latest" tag that isn't already on the node silently fails to pull.
          # The marker comment lets Flux's image automation commit new SemVer tags here
          # (k8s/flux/04-image-update-automation.yaml) - do not remove it.
          image: ghcr.io/lukislp/homelab-hub:1.3.2 # {"$imagepolicy": "flux-system:homelab-hub"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: NODE_ENV
              value: production
            # Backend TLS for the Gateway -> Pod hop (server.mjs terminates HTTPS natively).
            - name: HOMELAB_HUB_TLS_KEY
              value: /etc/homelab-hub-backend-tls/tls.key
            - name: HOMELAB_HUB_TLS_CERT
              value: /etc/homelab-hub-backend-tls/tls.crt
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backend-tls
              mountPath: /etc/homelab-hub-backend-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelab-hub-data
        - name: backend-tls
          secret:
            secretName: homelab-hub-backend-tls
