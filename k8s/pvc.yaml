apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-hub-data
  namespace: homelab-hub
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) instead
  # of local-path - a node dying no longer means restoring from last night's Velero backup,
  # links.json survives on the other node's replica.
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Mi
