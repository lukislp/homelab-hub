# homelab-hub namespace: default-deny in BOTH directions, then explicit allowances - the same
# shape claude-queue's k8s/07-netpol.yaml uses. The hub only ever receives traffic from the
# Gateway's data plane (backend TLS on 8080); nothing else talks to it. Outbound it needs DNS
# plus HTTP/HTTPS for the link probes and the favicon proxy - see homelab-hub-egress below.
#
# Unlike the sibling namespaces this one never had an egress policy at all, so adding the
# allowances and enforcing the restriction is necessarily one step: the first Egress-typed
# policy is what isolates the pod in the first place.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: homelab-hub
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-gateway-to-hub
  namespace: homelab-hub
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: homelab-hub } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nginx-gateway } }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: homelab-hub
spec:
  podSelector: {}
  policyTypes: ["Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: homelab-hub
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# The hub's only outbound traffic is the sweep loop in server/app.mjs (probeOnce, every
# SWEEP_INTERVAL_MS) and the favicon proxy at /api/icon/: both are plain http/https GETs against
# whatever URLs the link collection in /data/links.json holds - probeOnce rejects any other
# protocol outright. The targets are user-editable and a mix of public internet and this
# cluster's own Gateway (the *.lukas2311-homelab.com / *.heim.lan names), so no address
# allow-list is possible and the port is the restriction instead - the same trade-off
# claude-queue's api-egress makes.
#
# Every link currently in the collection is http or https on the default port (checked against
# the live /api/data), which is what these two rules cover. A link pointing at a non-default
# port (say https://proxmox:8006, as the seeded example set has) would probe as "offline" and
# needs its port added here - a grey status dot, not an outage.
#
# Nothing in-cluster beyond that: the link store is a JSON file on the PVC and
# automountServiceAccountToken is false, so there is no API-server access either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homelab-hub-egress
  namespace: homelab-hub
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: homelab-hub } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 80 }
