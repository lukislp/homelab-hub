# Applies EXCLUSIVELY k8s/flux-deploy/ (this repo's curated Flux-managed subset: PVC +
# Deployment incl. its Certificate + Service - see that folder's own kustomization.yaml).
# No RBAC changes needed on the reconciler side (homelab-infra's flux/01-reconciler-rbac.yaml)
# - the resource kinds used here (PersistentVolumeClaim/Deployment/Certificate/Service) are
# already covered by the existing shared ClusterRole.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-hub-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-hub
  path: ./k8s/flux-deploy
  prune: true
  wait: true
  timeout: 3m
