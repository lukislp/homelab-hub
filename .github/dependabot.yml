# Weekly Dependabot updates: GitHub Actions, npm (dev deps grouped) and the Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(docker)"
    # Base image major bumps (e.g. node 24 -> 26) are handled deliberately,
    # not via Dependabot; patch updates keep flowing.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
