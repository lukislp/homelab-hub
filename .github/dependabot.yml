# Weekly Dependabot updates: GitHub Actions, npm (dev deps grouped) and the Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      # react and react-dom must stay on the exact same version (React 19 refuses to start
      # otherwise), so they and their types always move together. Listed before "dev": the
      # first matching group wins.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(docker)"
    # Base image major bumps (e.g. node 24 -> 26) are handled deliberately,
    # not via Dependabot; patch updates keep flowing.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
