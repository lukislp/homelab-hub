name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  IMAGE: ghcr.io/lukislp/homelab-hub

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to master AND every pull request
  # ---------------------------------------------------------------------
  test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      # Build first so scripts/smoke.sh also exercises static/SPA-serving checks, not just
      # the API-only subset it falls back to when dist/ is missing.
      - run: npm run build
      - run: npm run smoke

  test-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npx tsc -b --noEmit

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      # Build first so the SPA-fallback/static-serving tests exercise a real dist/ (same
      # rationale as test-smoke above) instead of only the dist-missing 404 branch.
      - run: npm run build
      - run: npm run test:coverage
      # Self-hosted coverage badge (no external service), same pattern as this portfolio's
      # other repos: downloaded and committed by the semantic-release job below.
      - run: node scripts/generate-coverage-badge.mjs coverage/coverage-summary.json coverage-badge.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7

  test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm audit --audit-level=high

  test-k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run validate:k8s

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run build
      # playwright-core has no bundled browser - install one and point scripts/e2e.mjs at it
      # via PW_CHROMIUM (it also checks /opt/pw-browsers, which this doesn't use here).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: |
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f \( -name 'chrome' -o -name 'headless_shell' \) -path '*chrome-linux*' | head -1)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::could not locate installed chromium binary under ~/.cache/ms-playwright"
            exit 1
          fi
          echo "Using chromium at $CHROME_PATH"
          PW_CHROMIUM="$CHROME_PATH" npm run e2e

  build:
    # No implicit stage-sequencing under GitHub's DAG model (unlike GitLab) - wait for every
    # test job explicitly.
    needs: [test-smoke, test-typecheck, test-coverage, test-security, test-k8s-manifests, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run build

  # ---------------------------------------------------------------------
  # Version / docker / release — push to master only
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-hub-release-chain
      cancel-in-progress: false
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely - confirmed
    # live on the studylife-ai sibling repo (2026-08-12).
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/github
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. Downstream jobs below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  docker-build-push:
    # Runs after semantic-release (not before, see that job) - so a build/push failure here
    # never leaves an orphaned, un-tagged GHCR image blocking every future release via the
    # duplicate-tag guard below.
    needs: [get-version, semantic-release]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-hub-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    needs: [get-version, docker-build-push]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-hub-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  semantic-release:
    # Runs before docker-build-push now (see that job's comment) - the real tag/release must
    # exist before anything is published under that version.
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-hub-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage-badge
      - run: mkdir -p .github/badges && mv coverage-badge.json .github/badges/coverage.json
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/github
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to master landed between
      # this job's checkout and its own push (the concurrency group above already serializes
      # overlapping runs of this workflow, so this only guards against a genuinely external push).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin master
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/master)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/master moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/master did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B master origin/master
      - if: steps.semrel.outcome == 'failure'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/github
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
