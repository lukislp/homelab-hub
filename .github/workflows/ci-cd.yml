name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  IMAGE: ghcr.io/lukislp/homelab-hub

permissions:
  actions: read
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to master AND every pull request
  # ---------------------------------------------------------------------
  test-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      # Build first so scripts/smoke.sh also exercises static/SPA-serving checks, not just
      # the API-only subset it falls back to when dist/ is missing.
      - run: npm run build
      - run: npm run smoke

  test-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npx tsc -b --noEmit

  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      # Build first so the SPA-fallback/static-serving tests exercise a real dist/ (same
      # rationale as test-smoke above) instead of only the dist-missing 404 branch.
      - run: npm run build
      - run: npm run test:coverage
      # Self-hosted coverage badge (no external service), same pattern as this portfolio's
      # other repos: uploaded as a build artifact.
      - run: node scripts/generate-coverage-badge.mjs coverage/coverage-summary.json coverage-badge.json
      - name: Hand the coverage badge over for the bot commit
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/badge-handover/files/.github/badges"
          cp coverage-badge.json "$RUNNER_TEMP/badge-handover/files/.github/badges/coverage.json"
          printf '%s\n' .github/badges/coverage.json > "$RUNNER_TEMP/badge-handover/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-handover
          path: ${{ runner.temp }}/badge-handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm audit --audit-level=high

  test-k8s-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run validate:k8s

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run build
      # playwright-core has no bundled browser - install one and point scripts/e2e.mjs at it
      # via PW_CHROMIUM (it also checks /opt/pw-browsers, which this doesn't use here).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: |
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f \( -name 'chrome' -o -name 'headless_shell' \) -path '*chrome-linux*' | head -1)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::could not locate installed chromium binary under ~/.cache/ms-playwright"
            exit 1
          fi
          echo "Using chromium at $CHROME_PATH"
          PW_CHROMIUM="$CHROME_PATH" npm run e2e

  build:
    # No implicit stage-sequencing under GitHub's DAG model (unlike GitLab) - wait for every
    # test job explicitly.
    needs: [test-smoke, test-typecheck, test-coverage, test-security, test-k8s-manifests, test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache (e.g. left behind by a job
      # that got killed mid-install during a GitHub Actions infra incident) without paying the
      # cost of a clean cache on every normal run - only retries with `npm cache clean --force`
      # if the first `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run build

  # ---------------------------------------------------------------------
  # Version / docker / release — push to master only
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    # Dry run: works out the next version from the Conventional Commits (rules in
    # .github/lktec-bot.yml) and creates nothing. `release` below cuts the tag.
    concurrency:
      group: homelab-hub-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@a3ff31677bfa42df96089cd32b6f003fe0446ee2 # v0.8.1
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
  docker-build-push:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-26.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that
    # leg runs at native speed (same pattern as homelab-autodoc/UnifiProtectDashboard). Each
    # leg pushes by digest only; docker-manifest-merge below writes the actual
    # :latest/:$NEXT_VERSION tags. Runs after the release job (not before, see that job) -
    # a build/push failure here never leaves an orphaned, un-tagged GHCR image blocking
    # every future release via the duplicate-tag guard below.
    needs: [get-version, release]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          # Supply chain (2026-09-11 hardening): BuildKit attaches a SLSA provenance attestation
          # (which commit/workflow built this, from which base image) and an SPDX SBOM to every
          # per-arch image. They travel as extra "unknown/unknown" platform entries inside the
          # pushed index - GHCR shows them as such, containerd/k3s ignore them when pulling,
          # Trivy resolves the real linux/amd64 entry. imagetools create below carries them into
          # the multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, release, docker-build-push]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST (2026-09-11 hardening), so
      # every tag pointing at it (version, latest, sha-) is covered by one signature. The
      # signing identity is this workflow's OIDC certificate (repo + workflow path + ref), the
      # signature and the transparency-log entry live next to the image in GHCR. The verify
      # step right after is the live proof for this run and the exact identity constraint Flux
      # will use once its ImagePolicy verification is switched on (cluster phase).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/homelab-hub/\.github/workflows/ci-cd\.yml@refs/heads/master$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  # The image tag bump of the deploy manifests, committed onto the default branch by the lktec-bot App
  # (module sync: docs/modules/sync.md in lukislp/lktec-bot; the App is a bypass actor of the branch ruleset
  # for this one commit, which GitHub signs itself). Flux picks the new tag up from the branch.
  deploy-bump:
    needs: [get-version, release, docker-manifest-merge, trivy-scan, test-coverage]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    concurrency:
      group: homelab-hub-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/deploy-bump.yml@a3ff31677bfa42df96089cd32b6f003fe0446ee2 # v0.8.1
    with:
      version: ${{ needs.release.outputs.version }}
      images: 'ghcr\.io/lukislp/(homelab-hub)'
      paths: k8s
      branch: master
      handover-artifact: coverage-badge-handover
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  trivy-scan:
    needs: [get-version, release, docker-manifest-merge]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: homelab-hub-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        # A CRITICAL finding with an available fix blocks the rollout (deploy-bump needs this job);
        # unfixed ones are reported above but cannot be acted on yet.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release:
    # Runs before docker-build-push (see that job's comment) - the real tag/release must
    # exist before anything is published under that version.
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    concurrency:
      group: homelab-hub-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@a3ff31677bfa42df96089cd32b6f003fe0446ee2 # v0.8.1
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}